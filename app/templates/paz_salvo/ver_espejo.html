{% extends "base.html" %}

{% block content %}

<!-- El % de avance (campos_respondidos / campos_total / porcentaje) llega
     calculado desde areas.vista_previa(), misma fuente que usa pendientes.html,
     así los dos nunca se desincronizan -->

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <div>
            <span class="badge bg-primary rounded-pill px-3 py-1 mb-2">Modo de Solo Lectura</span>
            <h4 class="fw-bold text-dark m-0" style="color: #0f172a;">
                <i class="bi bi-eye-fill text-primary me-2"></i> Vista Previa del Documento
            </h4>
        </div>

        <!-- CONTROLES INTELIGENTES DE LA HOJA ESPEJO -->
        <div class="d-flex gap-2">

            <!-- Botón de Imprimir validado por el porcentaje -->
            {% if porcentaje == 100 %}
            <button onclick="window.print()" class="btn btn-success fw-bold shadow-sm" style="border-radius: 8px;">
                <i class="bi bi-printer-fill me-1"></i> Imprimir Trámite Completo
            </button>
            {% else %}
            <button disabled class="btn btn-light border fw-bold shadow-sm text-muted"
                style="border-radius: 8px; cursor: not-allowed;"
                title="El trámite debe completarse para poder imprimir">
                <i class="bi bi-lock-fill me-1"></i> Impresión Bloqueada ({{ porcentaje }}% · {{ campos_respondidos }}/{{ campos_total }})
            </button>
            {% endif %}

            <!-- Botón de Cerrar que devuelve a la tabla de Pendientes -->
            <a href="/areas/tareas" class="btn btn-secondary fw-bold shadow-sm"
                style="background: #64748b; border: none; border-radius: 8px;">
                <i class="bi bi-box-arrow-left me-1"></i> Volver a mi Bandeja
            </a>
        </div>
    </div>

    <!-- Contenedor que protege la hoja espejo -->
    <div class="card shadow-lg border-0 rounded-4" style="background: white; padding: 0;">
        <div style="pointer-events: none;">
            <!-- pointer-events: none bloquea cualquier interacción para proteger los datos -->
            {% include 'paz_salvo/partials/hoja_espejo.html' %}
        </div>
    </div>
</div>

<style>
    /* Aislamiento de impresión: se oculta TODO por defecto (sidebar incluido)
       y solo se muestra la tarjeta con la hoja espejo del documento */
    @media print {
        @page { margin: 0; size: A4; }

        body * { visibility: hidden !important; }
        .card, .card * { visibility: visible !important; }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            margin: 0;
            box-shadow: none !important;
            border: none !important;
            border-radius: 0 !important;
        }
    }
</style>
{% endblock %}
